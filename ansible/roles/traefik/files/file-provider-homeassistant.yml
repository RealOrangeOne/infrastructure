http:
  middlewares:
    homeassistant-allowlist:
      ipAllowList:
        sourceRange:
          - "{{ tailscale_cidr }}"
          - "{{ tailscale_cidr_ipv6 }}"
          - "{{ pve_hosts.forrest.ip }}"
          - "{{ pve_hosts.forrest.ipv6 }}"
          - 192.168.0.0/16
          - "{{ vault_lan_ipv6_cidr }}"
  routers:
    router-homeassistant:
      rule: Host(`homeassistant.jakehoward.tech`)
      service: service-homeassistant
      middlewares:
        - homeassistant-allowlist@file

  services:
    service-homeassistant:
      loadBalancer:
        servers:
          - url: http://{{ pve_hosts.homeassistant.ip }}:8123
